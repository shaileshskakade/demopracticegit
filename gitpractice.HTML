<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Management System</title>

<style>
:root {
    --navy: #102b50;
    --blue: #2563eb;
    --light: #f3f6fb;
    --border: #e2e8f0;
    --text: #172b4d;
    --muted: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--light);
    color: var(--text);
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.topbar {
    height: 66px;
    background: var(--navy);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
}

.brand-icon {
    font-size: 29px;
}

.top-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 14px;
}

.menu-button {
    display: none;
    background: transparent;
    color: white;
    border: 0;
    font-size: 25px;
}

.sidebar {
    width: 245px;
    position: fixed;
    top: 66px;
    bottom: 0;
    left: 0;
    background: var(--navy);
    padding: 15px 10px;
    overflow-y: auto;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    border: 0;
    color: #dce8fa;
    background: transparent;
    text-align: left;
    padding: 14px 13px;
    margin-bottom: 5px;
    border-radius: 7px;
    font-size: 14px;
}

.nav-item:hover,
.nav-item.active {
    background: var(--blue);
    color: white;
}

.nav-icon {
    width: 22px;
    font-size: 19px;
    text-align: center;
}

.main {
    margin-left: 245px;
    padding: 91px 24px 25px;
    min-height: 100vh;
}

.page-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 23px;
}

.page-heading h1 {
    font-size: 27px;
    margin-bottom: 6px;
}

.page-heading p {
    color: var(--muted);
    font-size: 14px;
}

.button {
    border: none;
    border-radius: 6px;
    background: var(--blue);
    color: white;
    padding: 10px 15px;
    font-size: 13px;
    font-weight: 600;
}

.button:hover {
    background: #1d4ed8;
}

.button.secondary {
    background: #64748b;
}

.button.danger {
    background: #dc2626;
}

.button.success {
    background: #15803d;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 22px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 19px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 5px #0f172a08;
}

.stat-icon {
    height: 52px;
    width: 52px;
    min-width: 52px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 25px;
    background: #dbeafe;
}

.stat-card:nth-child(2) .stat-icon {
    background: #dcfce7;
}

.stat-card:nth-child(3) .stat-icon {
    background: #ede9fe;
}

.stat-card:nth-child(4) .stat-icon {
    background: #ffedd5;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 27px;
    font-weight: 700;
}

.grid-three {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    min-width: 0;
    margin-bottom: 18px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 18px;
}

.bar-chart {
    height: 210px;
    display: flex;
    align-items: flex-end;
    justify-content: space-around;
    gap: 8px;
    border-bottom: 1px solid #cbd5e1;
    padding: 12px 5px 0;
}

.bar-column {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    flex: 1;
    min-width: 0;
}

.bar {
    width: min(30px, 85%);
    min-height: 3px;
    background: linear-gradient(#3b82f6, #2563eb);
    border-radius: 4px 4px 0 0;
}

.bar-label {
    height: 39px;
    padding-top: 8px;
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    overflow-wrap: anywhere;
}

.donut-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    min-height: 210px;
    flex-wrap: wrap;
}

.donut {
    width: 155px;
    height: 155px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: conic-gradient(
        #2563eb 0 36%,
        #f97316 36% 52%,
        #22c55e 52% 65%,
        #8b5cf6 65% 76%,
        #ec4899 76% 84%,
        #94a3b8 84% 100%
    );
}

.donut-hole {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: white;
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
}

.legend {
    font-size: 12px;
    line-height: 2.1;
}

.legend span {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 6px;
}

.salary-bars {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.salary-row {
    display: grid;
    grid-template-columns: 72px 1fr 65px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
}

.track {
    height: 12px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    background: #3b82f6;
    border-radius: 10px;
}

.table-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 17px;
    margin-bottom: 20px;
}

.table-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 17px;
}

.table-heading h3 {
    font-size: 17px;
}

.toolbar {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.input {
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 10px 11px;
    outline: none;
    background: white;
    color: var(--text);
    min-width: 0;
}

.input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px #2563eb15;
}

.search-input {
    width: 260px;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    white-space: nowrap;
}

th {
    background: #eff4fa;
    color: #334155;
    text-align: left;
    font-weight: 700;
    padding: 13px 11px;
}

td {
    padding: 13px 11px;
    border-bottom: 1px solid #e8edf4;
}

tbody tr:hover {
    background: #f8fafc;
}

.badge {
    padding: 5px 9px;
    background: #dcfce7;
    color: #166534;
    border-radius: 20px;
    font-size: 11px;
}

.action-btn {
    background: transparent;
    border: 0;
    margin-right: 8px;
    color: var(--blue);
    font-weight: 600;
}

.action-btn.delete {
    color: #dc2626;
}

.footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 18px 0;
    color: var(--muted);
    font-size: 12px;
}

.empty {
    padding: 35px;
    text-align: center;
    color: var(--muted);
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.form-group label {
    font-size: 13px;
    font-weight: 600;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.message {
    padding: 12px;
    background: #dcfce7;
    color: #166534;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 13px;
}

.hidden {
    display: none !important;
}

@media (max-width: 1100px) {
    .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-three {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 700px) {
    .topbar {
        padding: 0 14px;
    }

    .brand {
        font-size: 15px;
    }

    .brand-icon {
        font-size: 23px;
    }

    .top-right {
        display: none;
    }

    .menu-button {
        display: block;
    }

    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.2s;
        z-index: 20;
        width: 245px;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0;
        padding: 86px 13px 20px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
        gap: 9px;
    }

    .stat-card {
        padding: 12px;
        gap: 8px;
    }

    .stat-icon {
        width: 38px;
        height: 38px;
        min-width: 38px;
        font-size: 18px;
    }

    .stat-value {
        font-size: 21px;
    }

    .stat-label {
        font-size: 11px;
    }

    .page-heading h1 {
        font-size: 23px;
    }

    .search-input {
        width: 100%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="brand">

<main class="main">

</main>

function saveEmployees() {
    localStorage.setItem("hr_demo_employees", JSON.stringify(employees));
}

function money(value) {
    return "$" + Number(value || 0).toLocaleString("en-US");
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        }[char];
    });
}

function deptName(id) {
    const d = departments.find(x => x.id == id);
    return d ? d.name : "Department " + id;
}

function employeeName(id) {
    const e = employees.find(x => x.id == id);
    return e ? e.first + " " + e.last : (id || "N/A");
}

function jobTitle(id) {
    const j = jobs.find(x => x.id === id);
    return j ? j.title : id;
}

function toggleMenu() {
    document.getElementById("sidebar").classList.toggle("open");
}

function navigate(page, button) {
    document.querySelectorAll(".nav-item").forEach(item => {
        item.classList.remove("active");
    });

    if (button) button.classList.add("active");

    document.getElementById("sidebar").classList.remove("open");

    const content = document.getElementById("page-content");

    const pages = {
        dashboard: renderDashboard,
        employees: renderEmployees,
        departments: renderDepartments,
        jobs: renderJobs,
        salary: renderSalary,
        history: renderHistory,
        locations: renderLocations,
        audit: renderAudit,
        about: renderAbout
    };

    if (pages[page]) {
        content.innerHTML = pages[page]();
    }

    if (page === "employees") {
        renderEmployeeTable();
    }

    if (page === "dashboard") {
        renderRecentEmployees();
    }
}

function heading(title, subtitle, action = "") {
    return `
        <div class="page-heading">
            <div>
                <h1>${title}</h1>
                <p>${subtitle}</p>
            </div>
            ${action}
        </div>
    `;
}

function renderDashboard() {
    const totalSalary = employees.reduce((sum,e) => sum + Number(e.salary),0);
    const averageSalary = employees.length ? totalSalary / employees.length : 0;

    const deptCount = new Set(employees.map(e => e.dept)).size;

    const departmentTotals = {};
    employees.forEach(e => {
        departmentTotals[e.dept] = (departmentTotals[e.dept] || 0) + 1;
    });

    const topDepartments = Object.entries(departmentTotals)
        .sort((a,b) => b[1]-a[1])
        .slice(0,8);

    const maxCount = Math.max(1,...topDepartments.map(x => x[1]));

    const salaryJobs = {};
    employees.forEach(e => {
        salaryJobs[e.job] = (salaryJobs[e.job] || 0) + 1;
    });

    const topJobs = Object.entries(salaryJobs)
        .sort((a,b) => b[1]-a[1])
        .slice(0,5);

    const maxJob = Math.max(1,...topJobs.map(x => x[1]));

    return `
        ${heading("Dashboard","Overview of Employee Management and HR Analytics")}

        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div>

            </div>

                <div>

            </div>

            <div class="stat-card">
                <div class="stat-icon">💼</div>
                <div>

                    <div class="stat-value">${new Set(employees.map(e => e.job)).size}</div>
                </div>

function saveEmployee(event, oldId) {
    event.preventDefault();

    const form = event.target;
    const data = new FormData(form);

    const id = Number(data.get("id"));

    if (oldId === null && employees.some(e => e.id === id)) {
        alert("This Employee ID already exists.");
        return;
    }

    const email = String(data.get("email")).trim();

    if (employees.some(e => e.email.toLowerCase() === email.toLowerCase() && e.id !== oldId)) {
        alert("This email already exists.");
        return;
    }

    const employee = {
        id:id,
        first:String(data.get("first")).trim(),
        last:String(data.get("last")).trim(),
        email:email,
        phone:String(data.get("phone")).trim(),
        hire:String(data.get("hire")),
        job:String(data.get("job")),
        salary:Number(data.get("salary")),
        commission:0,
        manager:data.get("manager") ? Number(data.get("manager")) : "",
        dept:Number(data.get("dept"))
    };

    if (oldId !== null) {
        const index = employees.findIndex(e => e.id === oldId);
        if (index === -1) return;
        employees[index] = employee;
        auditLogs.unshift({
            time:new Date().toLocaleString(),
            action:"UPDATE",
            details:"Updated employee " + id
        });
    } else {
        employees.push(employee);
        auditLogs.unshift({
            time:new Date().toLocaleString(),
            action:"INSERT",
            details:"Added employee " + id
        });
    }

    saveEmployees();

    document.getElementById("message-area").innerHTML =
        `<div class="message">Employee record saved successfully in this browser demo.</div>`;

    navigate("employees");

    window.scrollTo({top:0,behavior:"smooth"});
}

function deleteEmployee(id) {
    if (!confirm("Are you sure you want to delete employee " + id + " from this browser demo?")) {
        return;
    }

    const index = employees.findIndex(e => e.id === id);
    if (index === -1) return;

    employees.splice(index,1);
    saveEmployees();

    auditLogs.unshift({
        time:new Date().toLocaleString(),
        action:"DELETE",
        details:"Deleted employee " + id
    });

    navigate("employees");

    document.getElementById("message-area").innerHTML =
        `<div class="message">Employee removed from the browser demo.</div>`;
}

function exportEmployees() {
    const headers = [
        "EMPLOYEE_ID","FIRST_NAME","LAST_NAME","EMAIL",
        "PHONE_NUMBER","HIRE_DATE","JOB_ID","SALARY","DEPARTMENT_ID"
    ];

    const rows = employees.map(e => [
        e.id,e.first,e.last,e.email,e.phone,e.hire,e.job,e.salary,e.dept
    ]);

    const csv = [headers,...rows].map(row =>
        row.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")
    ).join("\r\n");

    const blob = new Blob(["\uFEFF" + csv],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "HR_Employees_Demo.csv";
    a.click();

    URL.revokeObjectURL(url);
}

            <button class="button danger" onclick="resetDemo()">Reset Employee Demo Data</button>
        </div>
    `;
}

function filterSimpleTable(inputId, tableId) {
    const input = document.getElementById(inputId);
    const table = document.getElementById(tableId);

    if (!input || !table) return;

    const term = input.value.toLowerCase();

    table.querySelectorAll("tbody tr").forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(term) ? "" : "none";
    });
}

function resetDemo() {
    if (!confirm("Reset all employee demo changes and restore the original sample records?")) {
        return;
    }

    localStorage.removeItem("hr_demo_employees");

    employees.splice(0,employees.length,...initialEmployees);

    auditLogs.length = 0;

    navigate("dashboard");

    document.getElementById("message-area").innerHTML =
        `<div class="message">Demo employee records have been reset.</div>`;
}

/* Open the dashboard when the HTML file starts. */
navigate("dashboard");
</script>
